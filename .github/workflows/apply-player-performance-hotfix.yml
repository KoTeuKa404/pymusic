name: Apply player performance hotfix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-player-performance-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch player code
