def _extract_related_from_search(
    video_url: str,
    title: str = "",
    channel: str = "",
    limit: int = 12,
) -> List[Dict[str, Any]]:
    """Fast fallback based on the existing YouTube search parser."""
    try:
        from youtube_search import fetch_youtube_results

        current_id = _extract_video_id_from_url(video_url)
        clean_title = re.sub(r"[^\w\s-]+", " ", str(title or ""), flags=re.UNICODE)
        clean_channel = re.sub(r"[^\w\s-]+", " ", str(channel or ""), flags=re.UNICODE)
        clean_title = re.sub(r"\s+", " ", clean_title).strip()
        clean_channel = re.sub(r"\s+", " ", clean_channel).strip()

        queries = []
        if clean_title and clean_channel:
            queries.append(f"{clean_title} {clean_channel}")
        if clean_title:
            queries.append(clean_title)
        if clean_channel:
            queries.append(clean_channel)

        out: List[Dict[str, Any]] = []
        seen = set()
        for query in queries:
            videos, _playlists, _continuation, _cfg = fetch_youtube_results(query)
            for entry in videos or []:
                if not isinstance(entry, (tuple, list)) or not entry:
                    continue
                url = str(entry[0] or "")
                video_id = _extract_video_id_from_url(url)
                if not video_id or video_id == current_id or video_id in seen:
                    continue
                seen.add(video_id)
                out.append({
                    "id": video_id,
                    "url": url or f"https://www.youtube.com/watch?v={video_id}",
                    "title": str(entry[1] or "") if len(entry) > 1 else "",
                    "channel": str(entry[2] or "") if len(entry) > 2 else "",
                    "thumbnail": (
                        str(entry[3] or "")
                        if len(entry) > 3
                        else f"https://i.ytimg.com/vi/{video_id}/mqdefault.jpg"
                    ),
                    "duration": str(entry[4] or "") if len(entry) > 4 else "",
                })
                if len(out) >= int(limit or 12):
                    return out
            if out:
                break
        return out[: int(limit or 12)]
    except Exception as exc:
        try:
            print("[RELATED] search fallback failed:", exc)
        except Exception:
            pass
        return []


def extract_related_videos(
    video_url: str,
    *,
    title: str = "",
    channel: str = "",
    limit: int = 12,
) -> List[Dict[str, Any]]:
    """Load recommendations independently so audio startup is never blocked."""
    results = _extract_related_from_search(
        video_url,
        title=title,
        channel=channel,
        limit=limit,
    )
    if results:
        return results[: int(limit or 12)]
    return _extract_related_from_watch_page(
        video_url,
        _ANDROID_WEB_UA,
        limit=limit,
    )[: int(limit or 12)]

