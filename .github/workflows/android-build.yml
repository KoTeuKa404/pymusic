name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "android_src/**"
      - "java_src/**"
      - "p4a-recipes/**"
      - "buildozer.spec"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache cmake gettext git libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libssl-dev libtool ninja-build patch pkg-config unzip zip zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel virtualenv
          python -m pip install "setuptools<72" "Cython<3" "buildozer==1.5.0"

      - name: Cache build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            .buildozer/android/platform
          key: pymusic-android-p4a-develop-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          PYTHONUNBUFFERED: "1"
        run: |
          sed -i 's/-Xmx6144m/-Xmx4096m/g' buildozer.spec
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          # Buildozer invokes sdkmanager interactively on a clean runner.
          # Feed "yes" to every Android SDK licence prompt, while preserving
          # Buildozer's real exit code instead of the exit code from tee/yes.
          set +e
          yes | buildozer -v android debug 2>&1 | tee buildozer-build.log
          BUILD_STATUS=${PIPESTATUS[1]}
          set -e
          exit "$BUILD_STATUS"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "dist/PyMusic-debug.apk"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # GitHub Actions artifacts are always downloaded as ZIP archives.
          # Keep one moving prerelease instead, so the asset itself downloads
          # directly as PyMusic-debug.apk with no ZIP wrapper or hash filename.
          gh release delete latest-debug --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create latest-debug \
            "dist/PyMusic-debug.apk#PyMusic-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "PyMusic latest debug APK" \
            --notes "Latest debug APK built from commit $GITHUB_SHA." \
            --prerelease

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PyMusic-build-log-${{ github.sha }}
          path: buildozer-build.log
          if-no-files-found: ignore
          retention-days: 7
