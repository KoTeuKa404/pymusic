name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - "android_src/**"
      - "java_src/**"
      - "p4a-recipes/**"
      - "buildozer.spec"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require configured signing secrets
        env:
          PYMUSIC_SIGNING_KEYSTORE_B64: ${{ secrets.PYMUSIC_SIGNING_KEYSTORE_B64 }}
          PYMUSIC_SIGNING_PASSWORD: ${{ secrets.PYMUSIC_SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$PYMUSIC_SIGNING_KEYSTORE_B64" || -z "$PYMUSIC_SIGNING_PASSWORD" ]]; then
            echo "::error::Configure the persistent PyMusic signing key and password before building a new APK."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache cmake gettext git libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libssl-dev libtool ninja-build patch pkg-config unzip zip zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel virtualenv
          python -m pip install "setuptools<72" "Cython<3" "buildozer==1.5.0"

      - name: Cache build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            .buildozer/android/platform
          key: pymusic-android-p4a-develop-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          PYTHONUNBUFFERED: "1"
        run: |
          sed -i 's/-Xmx6144m/-Xmx4096m/g' buildozer.spec
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          # Buildozer invokes sdkmanager interactively on a clean runner.
          # Feed "yes" to every Android SDK licence prompt, while preserving
          # Buildozer's real exit code instead of the exit code from tee/yes.
          set +e
          yes | buildozer -v android debug 2>&1 | tee buildozer-build.log
          BUILD_STATUS=${PIPESTATUS[1]}
          set -e
          exit "$BUILD_STATUS"

      - name: Sign and verify APK with persistent key
        env:
          PYMUSIC_SIGNING_KEYSTORE_B64: ${{ secrets.PYMUSIC_SIGNING_KEYSTORE_B64 }}
          PYMUSIC_SIGNING_PASSWORD: ${{ secrets.PYMUSIC_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$PYMUSIC_SIGNING_KEYSTORE_B64"
          test -n "$PYMUSIC_SIGNING_PASSWORD"
          signing_dir="$(mktemp -d "$RUNNER_TEMP/pymusic-signing.XXXXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$PYMUSIC_SIGNING_KEYSTORE_B64" | base64 --decode > "$signing_dir/pymusic.p12"
          unset PYMUSIC_SIGNING_KEYSTORE_B64

          APK_PATH="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          APKSIGNER="$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          mkdir -p dist

          # Never publish the runner's randomly generated debug signature.
          "$APKSIGNER" sign --ks "$signing_dir/pymusic.p12" \
            --ks-key-alias pymusic \
            --ks-pass env:PYMUSIC_SIGNING_PASSWORD \
            --key-pass env:PYMUSIC_SIGNING_PASSWORD \
            --out dist/PyMusic-debug.apk "$APK_PATH"

          expected="$(keytool -exportcert -keystore "$signing_dir/pymusic.p12" \
            -alias pymusic -storepass:env PYMUSIC_SIGNING_PASSWORD | sha256sum | cut -d ' ' -f 1)"
          unset PYMUSIC_SIGNING_PASSWORD
          "$APKSIGNER" verify --verbose --print-certs dist/PyMusic-debug.apk > "$signing_dir/verification.txt"
          cat "$signing_dir/verification.txt"
          grep -Fi "certificate SHA-256 digest: $expected" "$signing_dir/verification.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$signing_dir/verification.txt"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Keep one moving prerelease whose APK can be downloaded directly.
          # Do not delete/recreate the release: transient GitHub API failures can
          # leave the tag in place and make the following create fail. Updating
          # the existing release is idempotent and safe for repeated builds.
          publish_latest() {
            if gh release view latest-debug >/dev/null 2>&1; then
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest-debug" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null

              gh release upload latest-debug \
                "dist/PyMusic-debug.apk#PyMusic-debug.apk" \
                --clobber

              gh release edit latest-debug \
                --title "PyMusic latest debug APK" \
                --notes "Latest debug APK built from commit $GITHUB_SHA." \
                --prerelease
            else
              gh release create latest-debug \
                "dist/PyMusic-debug.apk#PyMusic-debug.apk" \
                --target "$GITHUB_SHA" \
                --title "PyMusic latest debug APK" \
                --notes "Latest debug APK built from commit $GITHUB_SHA." \
                --prerelease
            fi
          }

          for attempt in 1 2 3; do
            if publish_latest; then
              exit 0
            fi
            echo "GitHub release publish attempt ${attempt}/3 failed; retrying..." >&2
            sleep $((attempt * 4))
          done

          echo "Unable to publish latest-debug after 3 attempts." >&2
          exit 1

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PyMusic-build-log-${{ github.sha }}
          path: buildozer-build.log
          if-no-files-found: ignore
          retention-days: 7
