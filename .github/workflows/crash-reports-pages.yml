name: PyMusic Crash Reports Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/crash-reports-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pymusic-crash-reports-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
