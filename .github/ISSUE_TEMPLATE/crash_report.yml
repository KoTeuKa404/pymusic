name: PyMusic crash report
description: Повідомити про збій Android-застосунку PyMusic
title: "[PyMusic Crash] "
labels:
  - "crash-report"
body:
  - type: markdown
    attributes:
      value: |
        Усі GitHub Issues у цьому репозиторії публічні.
        Видаліть паролі, токени, персональні URL та приватні дані перед надсиланням.
        Кнопка Crash Report у PyMusic копіює очищений лог, якщо шлюз ще не налаштований.
  - type: textarea
    id: crash-log
    attributes:
      label: Очищений лог і опис
      description: Вставте лог із буфера обміну Android.
      placeholder: |
        Що сталося?
        Додайте очищений діагностичний текст з PyMusic.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Як відтворити
      description: Необов'язково, але допомагає знайти причину.
  - type: checkboxes
    id: privacy
    attributes:
      label: Публікація
      options:
        - label: Я перевірив(-ла), що репорт не містить приватної інформації.
          required: true
